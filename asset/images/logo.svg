<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hb_main" x1="394" y1="212" x2="76" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>

    <linearGradient id="hb_upper" x1="178" y1="160" x2="342" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <linearGradient id="hb_loop" x1="224" y1="380" x2="286" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Clockwise 90-degree laid-down geometry (J hook forms bottom/left cradle) -->
  <!-- 1. Self-Reflection Dashed Return Arc -->
  <path d="M 224 380 C 274 380, 286 334, 286 284" fill="none" stroke="url(#hb_loop)" stroke-width="6.5" stroke-dasharray="8 8" stroke-linecap="round"/>

  <!-- 2. Upper Parallel Workflow Track (Passes through Router Diamond) -->
  <path d="M 394 212 L 342 160 L 230 160 L 178 212" fill="none" stroke="url(#hb_upper)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Lower Primary Track + Left-to-Bottom "J" Hook -->
  <path d="M 394 212 L 342 264 L 230 264 L 178 212 L 164 212 A 84 84 0 0 0 164 380 L 210 380" fill="none" stroke="url(#hb_main)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 4. Crisp Workflow Arrowhead at Bottom-Right Return -->
  <path d="M 190 352 L 224 380 L 190 408" fill="none" stroke="#38BDF8" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 5. Pure Graph Nodes -->
  <!-- Right Start / Entry Node -->
  <circle cx="394" cy="212" r="22" fill="#080C14" stroke="#38BDF8" stroke-width="9"/>
  <circle cx="394" cy="212" r="7" fill="#F59E0B"/>

  <!-- Lower Track: Task Execution Circle Node -->
  <circle cx="286" cy="264" r="18" fill="#080C14" stroke="#38BDF8" stroke-width="8"/>
  <circle cx="286" cy="264" r="6" fill="#38BDF8"/>

  <!-- Upper Track: Conditional Router Diamond Node -->
  <g transform="translate(286, 160) rotate(45)">
    <rect x="-15" y="-15" width="30" height="30" rx="5" fill="#080C14" stroke="#F59E0B" stroke-width="7.5"/>
  </g>

  <!-- Left Merge Node -->
  <circle cx="178" cy="212" r="15" fill="#080C14" stroke="#0284C7" stroke-width="7.5"/>
</svg>
