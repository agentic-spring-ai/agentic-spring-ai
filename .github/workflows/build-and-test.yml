name: 🛠️ Build and Test
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  ENABLE_TEST_CI: true
permissions:
  contents: read
jobs:
  format:
    if: (github.repository == 'agentic-spring-ai/agentic-spring-ai')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - uses: ./tools/github-actions/setup-extensions
      - run: make tools
      - run: make format-check
  check-style:
    if: (github.repository == 'agentic-spring-ai/agentic-spring-ai')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - uses: ./tools/github-actions/setup-extensions
      - run: make tools
      - run: make checkstyle-check
  test:
    if: (github.repository == 'agentic-spring-ai/agentic-spring-ai')
    runs-on: ubuntu-22.04
    needs: [format, check-style]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - uses: ./tools/github-actions/setup-extensions
      - run: make tools
      - run: make test
  compatibility:
    if: (github.repository == 'agentic-spring-ai/agentic-spring-ai')
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        java: ['17', '21']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
        with:
          java-version: ${{ matrix.java }}
      - uses: ./tools/github-actions/setup-extensions
      - run: ./mvnw -B -DskipTests compile
  build:
    if: (github.repository == 'agentic-spring-ai/agentic-spring-ai')
    runs-on: ubuntu-22.04
    needs: [format, check-style, test, compatibility]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - uses: ./tools/github-actions/setup-extensions
      - run: corepack enable
      - run: corepack prepare pnpm@10.5.1 --activate
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui install --frozen-lockfile
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui audit --prod
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui run format:check
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui run lint
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui exec tsc --noEmit
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui run test
      - run: pnpm --dir agentic-spring-ai-studio/agent-chat-ui run build:static
      - run: make tools
      - run: make build
      - name: Verify packaged Studio UI
        shell: bash
        run: |
          studio_jar="$(find agentic-spring-ai-studio/target -maxdepth 1 \
            -name 'agentic-spring-ai-studio-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          test -n "$studio_jar"
          jar tf "$studio_jar" | grep -q 'META-INF/resources/chatui/index.html'
  examples:
    if: (github.repository == 'agentic-spring-ai/agentic-spring-ai')
    runs-on: ubuntu-22.04
    needs: [build]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./tools/github-actions/setup-deps
      - uses: ./tools/github-actions/setup-extensions
      - run: ./mvnw -B -DskipTests install
      - name: Compile standalone examples
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r pom; do
            ./mvnw -B -f "$pom" -DskipTests compile
          done < <(find examples -name pom.xml | sort)
